[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-recovery"
version = "0.0.0"
requires-python = ">=3.10"
description = "Ferramentas seguras de inspeção e verificação de backups RP2040"

[project.scripts]
hs-recovery = "hs_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
