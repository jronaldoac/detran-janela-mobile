<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vazão">
  <title>Medidor de Vazão</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <span class="eyebrow">HIDROSOLO</span>
        <h1>Medidor de Vazão</h1>
      </div>
      <div class="saved-badge"><strong id="totalSaved">0</strong> medições</div>
    </header>

    <nav class="stations" id="stations" aria-label="Ponto de medição"></nav>

    <section class="measure">
      <div class="measure-title">
        <strong id="currentStation">Torneira 1</strong>
        <span>coleta volumétrica</span>
      </div>

      <div class="inputs">
        <label>Volume coletado
          <div class="field">
            <input id="volume" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            <i>mL</i>
          </div>
        </label>
        <label>Tempo
          <div class="field">
            <input id="seconds" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
            <i>s</i>
          </div>
        </label>
      </div>

      <div class="timer">
        <div class="timer-display">
          <span>CRONÔMETRO</span>
          <strong id="timerText">00:00.00</strong>
        </div>
        <div class="timer-actions">
          <button id="startTimer" class="primary-mini" type="button">Iniciar</button>
          <button id="pauseTimer" type="button">Pausar</button>
          <button id="resetTimer" type="button">Resetar</button>
          <button id="insertTimer" type="button">Inserir</button>
        </div>
      </div>

      <div class="result">
        <div class="result-block">
          <span>VAZÃO</span>
          <strong id="mlsResult">0,00</strong>
          <small>mL/s</small>
        </div>
        <div class="result-block primary">
          <span>CONVERTIDO</span>
          <strong id="lhResult">0,00</strong>
          <small>L/h</small>
        </div>
      </div>

      <button id="saveMeasurement" class="save" type="button" disabled>Salvar medição</button>
    </section>

    <section class="overview">
      <div class="section-head">
        <strong>Valores guardados</strong>
        <span>último • média • quantidade</span>
      </div>
      <div class="summary" id="summary"></div>
    </section>

    <section class="history">
      <div class="section-head">
        <strong id="historyTitle">Histórico — Torneira 1</strong>
        <span id="historyCount">0 registros</span>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="footer-actions">
        <button class="ghost-btn" id="copyData" type="button">Copiar dados</button>
        <button class="ghost-btn danger" id="clearStation" type="button">Limpar ponto</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">Salvo</div>
  <script src="./app.js"></script>
</body>
</html>
